name: Validate and package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install Lua tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1 luarocks
          sudo luarocks --lua-version=5.1 install luacheck 1.2.0-1
          sudo luarocks --lua-version=5.1 install lua-cjson 2.1.0.10-1
      - run: npm ci
      - name: Check commit messages
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$BASE" ]; then
            npx --no -- commitlint --from "$BASE" --to "$HEAD" --verbose
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            npx --no -- commitlint --from "$BEFORE" --to "$HEAD" --verbose
          else
            git rev-list --reverse "$HEAD" | while read -r commit; do
              git show -s --format=%B "$commit" | npx --no -- commitlint --verbose
            done
          fi
      - run: npm run check
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: Wildwise-mod
          path: dist/Wildwise-0.2.1.zip*
